name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format · Lint · Types · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          SENTRYCLI_SKIP_DOWNLOAD: 1
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        timeout-minutes: 5

      - name: Format, lint, types, tests and coverage
        run: npm run check:code

      - name: Web export
        run: npm run build:web

      # Unit tests never load the exported site; this fails if a page ships
      # without its JS bundle <script> tags (the SDK 58 regression).
      - name: Verify web export
        run: npm run verify:web

      - name: Expo compatibility
        run: npm run doctor

      - name: Worker runtime integration
        run: npm run verify:worker

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser and accessibility smoke tests
        run: npm run test:web

      - name: Upload browser test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
