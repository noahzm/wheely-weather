<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky-fill" x2="0" y2="1">
      <stop stop-color="#C97AD6"/>
      <stop offset=".52" stop-color="#ECAFE8"/>
      <stop offset="1" stop-color="#FCE0EE"/>
    </linearGradient>
    <radialGradient id="cloud-light" gradientUnits="userSpaceOnUse" cx="92" cy="24" fx="92" fy="24" r="142">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#EBDDF5" stop-opacity=".78"/>
    </radialGradient>
    <linearGradient id="cloud-belly" gradientUnits="userSpaceOnUse" x1="0" y1="54" x2="0" y2="82">
      <stop offset="0" stop-color="#C9BBE0" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9BBE0" stop-opacity=".72"/>
    </linearGradient>
    <filter id="cloud-soft" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <path id="cloud-body" d="M22,78 C14,78 14,62 28,58 C30,44 48,38 64,44 C74,26 108,20 128,36 C144,32 162,42 166,54 C184,54 188,78 170,78 Z"/>
    <radialGradient id="sun-fill" cx=".38" cy=".32" r=".78">
      <stop stop-color="#FFF9CC"/>
      <stop offset=".48" stop-color="#FFE14D"/>
      <stop offset="1" stop-color="#FFAC1C"/>
    </radialGradient>
    <radialGradient id="sun-glow">
      <stop stop-color="#FFF6BA" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#FFE68A" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land-fill" x2=".3" y2="1">
      <stop stop-color="#4CC983"/>
      <stop offset="1" stop-color="#14773F"/>
    </linearGradient>
    <linearGradient id="road-fill" x2=".25" y2="1">
      <stop stop-color="#3E3C49"/>
      <stop offset="1" stop-color="#23222E"/>
    </linearGradient>
  </defs>
  <g id="sky">
    <rect width="1024" height="1024" fill="url(#sky-fill)"/>
    <g filter="url(#cloud-soft)" transform="translate(-75 -16) scale(2.55 2.05)">
      <use href="#cloud-body" fill="url(#cloud-light)"/>
      <use href="#cloud-body" fill="url(#cloud-belly)"/>
    </g>
    <path d="M720 492 C765 478 825 466 878 474 C920 462 975 470 1015 486 C975 496 905 498 835 498 C780 498 742 496 720 492 Z" fill="#FFFFFF" opacity=".52" filter="url(#cloud-soft)"/>
  </g>
  <g id="glow">
    <circle cx="512" cy="480" r="510" fill="url(#sun-glow)"/>
  </g>
  <g id="sun">
    <circle cx="512" cy="482" r="308" fill="url(#sun-fill)"/>
  </g>
  <g id="land">
    <path d="M0 622 C175 568 345 590 478 686 H546 C679 590 849 568 1024 622 V1024 H0 Z" fill="url(#land-fill)"/>
  </g>
  <g id="road">
    <path d="M478 686 C428 755 335 865 204 1024 H820 C689 865 596 755 546 686 Z" fill="url(#road-fill)"/>
  </g>
  <g id="dashes">
    <path d="M504 756 H520 L526 828 H498 Z M491 896 H533 L544 1002 H480 Z" fill="#FFF8E3"/>
  </g>
</svg>
