# Opens a mock scenario. Locally (`npm run e2e:ios`) it first loads the JS
# bundle from Metro in the dev client; with MAESTRO_RELEASE_BUILD=true (the EAS
# e2e build) the app has its bundle built in, so it's launched directly, with
# location denied so a fresh install shows no permission prompt.
# The mock data is fixed, but it's keyed to the clock (sunset, the next hours),
# so assertions match ranges and stable text, never the rotating verdict headline.
appId: app.wheelyweather
---
- runFlow:
    when:
      # typeof keeps an unset variable (every local run) from throwing.
      true: ${typeof MAESTRO_RELEASE_BUILD === 'undefined' || MAESTRO_RELEASE_BUILD !== 'true'}
    commands:
      - openLink: exp+wheely-weather://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
      - extendedWaitUntil:
          visible: 'Hour by hour|Where are you riding\?|Forecast unavailable|Something went sideways'
          timeout: 60000
- runFlow:
    when:
      true: ${typeof MAESTRO_RELEASE_BUILD !== 'undefined' && MAESTRO_RELEASE_BUILD === 'true'}
    commands:
      - launchApp:
          permissions:
            # iOS location takes always/inuse/never; Maestro 2.11 rejects deny here.
            location: never
- openLink: wheelyweather:///?mock=${MOCK}
# iOS asks before a custom-scheme link opens an app that isn't in front.
- runFlow:
    when:
      visible: 'Open in .*Wheely Weather.*'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Hour by hour'
    timeout: 30000
- waitForAnimationToEnd
