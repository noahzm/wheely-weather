appId: app.wheelyweather
name: Tabs keep the mock scenario
---
- runFlow:
    file: subflows/open-scenario.yaml
    env:
      MOCK: alert
- extendedWaitUntil:
    visible: '.*Severe Thunderstorm Warning.*'
    timeout: 10000
- tapOn: 'Search'
- assertVisible: 'Search a city or place'
# The search tab no longer opens focused, but if search is active, the keyboard
# folds the tab bar down to "Weather" alone; closing search brings the other tabs back.
- tapOn:
    text: 'Close'
    optional: true
- tapOn: 'Settings'
- assertVisible: 'Appearance'
- tapOn: 'Weather'
# Tab navigation drops query params; ForecastProvider must keep the scenario latched.
- assertVisible: '.*Severe Thunderstorm Warning.*'
