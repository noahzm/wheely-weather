appId: app.wheelyweather
name: Tabs keep the mock scenario
---
- runFlow:
    file: subflows/open-scenario.yaml
    env:
      MOCK: alert
- extendedWaitUntil:
    visible: '.*Severe Thunderstorm Warning.*'
    timeout: 10000
- tapOn: 'Search'
- assertVisible: 'Search a city or place'
# The search tab no longer opens focused, but if search is active, closing it
# puts the keyboard away.
- tapOn:
    text: 'Close'
    optional: true
# On iOS 27 the Search tab can fold the bar down to a single collapsed "Weather"
# button (always on the EAS simulator), so Settings is reached through Weather.
- tapOn: 'Weather'
- assertVisible: '.*Severe Thunderstorm Warning.*'
- tapOn: 'Settings'
- assertVisible: 'Appearance'
- tapOn: 'Weather'
# Tab navigation drops query params; ForecastProvider must keep the scenario latched.
- assertVisible: '.*Severe Thunderstorm Warning.*'
