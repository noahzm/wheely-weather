appId: app.wheelyweather
name: Wait for a later window
---
- runFlow:
    file: subflows/open-scenario.yaml
    env:
      MOCK: wait
- extendedWaitUntil:
    # The verdict headline's preventOrphans glues the space before the time
    # into U+00A0, so the separator after the phrase is not always a plain space.
    visible: '(Ride at|Wait till|Hold till|Roll out at|Better at)[\s\u00A0].*'
    timeout: 10000
